<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/f4331547b8.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <div class="bg-img">
            <img src="7853a384128734e29dde9d46a5cb14984fe7265f.jpg" alt="side-photo">
        </div>

        <div class="container">
            <div class="logo">
                <img src="logo.png" alt="logo">
            </div>
            <div class="heading">
                <p>Log into your Account</p>
            </div>
            <form>
                <div class="data-entry">
                    <div class="mail">
                        <i class="fa-solid fa-envelope envelope"></i><input type="text" placeholder="abc@email.com" required>
                    </div>
                    <div class="pass">
                        <i class="fa-solid fa-lock lock"></i><input type="password" placeholder="Password" required><i
                            class="fa-solid fa-eye eye"></i>
                    </div>
                    <a href="#">
                        <p>Forgot Password?</p>
                    </a>
                </div>
                <div class="login-mtd">
                    <div>
                        <button class="signin">Sign in</button>
                    </div>
                    <div class="section-br">
                        <hr>
                        <p>or</p>
                        <hr>
                    </div>
                    <div>
                        <button class="google">
                            <img src="Google.png" alt="google">Sign in with Google</button>
                    </div>
                    <div>
                        <button class="facebook">
                            <img src="akar-icons_facebook-fill.png" alt="facebook">Sign in with Facebook</button>
                    </div>
                    <div>
                        <button class="apple">
                            <img src="Mask group.png" alt="">Sign in with Apple</button>
                    </div>
                    <div class="account">
                        <p>Don't have an account? <a href="#" class="create">Create Account</a></p>
                    </div>
                </div>
                </form>
        </div>
    </div>
</body>

</html>
